<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skorpi's Awesome D&D Automation Sheet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

<section class="section is-hidden" id="app">
    <div class="container">
        <div class="is-flex is-flex-direction-column is-justify-content-center is-align-items-center">
            <span class="title">Skorpi's Awesome D&D Automation Sheet</span>
        </div>

        <hr class="has-background-grey-dark my-5" />

        <div class="" id="menu"></div>

        <hr class="has-background-grey-dark my-5" />

        <div class="" id="character-info-section"></div>

        <hr class="has-background-grey-dark my-5" />

        <div class="" id="note-banner"></div>

        <hr class="has-background-grey-dark my-5" />

        <div id="character-status-section"></div>

        <hr class="has-background-grey-dark my-5" />

        <div class="" id="attribute-section"></div>

        <hr class="has-background-grey-dark my-5" />

        <div class="card">
            <div class="tabs is-left is-boxed is-size-5" id="character-tabs">
                <ul>
                    <li class="is-active" data-tab="weapons">
                        <a>
                            <span class="icon is-small"
                                ><i class="fas fa-shield-halved" aria-hidden="true"></i
                            ></span>
                            <span>Weapons</span>
                        </a>
                    </li>
                    <li data-tab="spells">
                        <a>
                            <span class="icon is-small"
                                ><i class="fas fa-book" aria-hidden="true"></i
                            ></span>
                            <span>Spells</span>
                        </a>
                    </li>
                    <li data-tab="entities">
                        <a>
                            <span class="icon is-small"
                                ><i class="fas fa-user-plus" aria-hidden="true"></i
                            ></span>
                            <span>Entities</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div id="section-weapons" class="card-content pt-0">
                <div class="" id="curreny-stat-banner"></div>

                <hr class="has-background-grey-dark my-5" />

                <div class="columns is-multiline" id="weapon-section"></div>
            </div>

            <div id="section-spells" class="card-content is-hidden">
                <div class="columns is-multiline" id="spell-casting-section"></div>
                <div class="columns is-multiline" id="spell-section"></div>
            </div>

            <div id="section-entities" class="card-content is-hidden">
                <div class="columns is-multiline" id="entity-section"></div>
            </div>
        </div>

        <hr class="has-background-grey-dark my-5" />

        <div class="card">
            <div class="card-header">
                <span class="title m-4 is-4">Proficient Proficiencies & Languages</span>
            </div>
            <div class="card-content">
                <div class="columns is-multiline" id="active-proficiencies-section" style="width: 100%"></div>
            </div>
        </div>

        <hr class="has-background-grey-dark my-5" />

        <div class="card" id="proficiency-section"></div>
    </div>
</section>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
